# Ships master to production at night, when nobody is playing.
#
# Why: Cloudflare restarts every Durable Object on each deploy, and that drops every open race at once. When every merge to master deployed, a busy day of merges meant a "random crash"
# every few minutes. Now Cloudflare's production branch is `production` (Workers Builds > Branch control), and this
# workflow moves `production` up to master:
#   - every hour from 09:00 to 14:00 UTC (1-6 am Pacific), only if nobody is in a game right now;
#   - or whenever someone runs it by hand (Actions > Deploy to production > Run workflow), with "even if people are
#     playing" ticked to skip the check.
# Setup and the manual route: docs/DEPLOYMENT.md, "When deploys happen".
name: Deploy to production

on:
  schedule:
    - cron: '0 9-14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if people are playing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      # The live site, e.g. https://toge.<you>.workers.dev or your domain (Settings > Secrets and variables > Actions).
      SITE: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Anything new on master?
        id: diff
        run: |
          if git rev-parse -q --verify origin/production >/dev/null && [ "$(git rev-parse origin/production)" = "$(git rev-parse HEAD)" ]; then
            echo "production is already at master ($(git rev-parse --short HEAD))"
            echo "ship=no" >> "$GITHUB_OUTPUT"
          else
            echo "ship=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Is anyone playing?
        id: live
        if: steps.diff.outputs.ship == 'yes'
        run: |
          # Every open race room lists its player count (solo time trials too).
          if [ -z "$SITE" ]; then echo "Set the SITE_URL variable first."; echo "players=-1" >> "$GITHUB_OUTPUT"; exit 0; fi
          urls="$SITE/api/races"
          total=0
          for u in $urls; do
            n=$(curl -fsS --max-time 20 "$u" | jq '[.[].players // 0] | add // 0') || { echo "could not read $u"; n=-1; }
            if [ "$n" -lt 0 ]; then total=-1; break; fi
            echo "$u: $n"
            total=$((total + n))
          done
          echo "players=$total" >> "$GITHUB_OUTPUT"

      - name: Move production to master
        if: steps.diff.outputs.ship == 'yes'
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          PLAYERS: ${{ steps.live.outputs.players }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$PLAYERS" != "0" ]; then
            echo "Not deploying: players online = $PLAYERS (-1 means the site couldn't be checked). The next hourly run tries again."
            exit 0
          fi
          git push --force origin HEAD:refs/heads/production
          echo "production -> $(git rev-parse --short HEAD); Cloudflare builds and deploys it now."
